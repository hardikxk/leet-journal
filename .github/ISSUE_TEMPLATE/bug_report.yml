name: Bug Report
description: Report a bug to help improve Leet Journal
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: Tell us what happened
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: It should have worked
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: It crashed
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: What Java version are you running?
      placeholder: "17"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you on?
      placeholder: Ubuntu 22.04 / macOS 14 / Windows 11
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Copy and paste any relevant logs or screenshots
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: gssoc
    attributes:
      label: GSSoC
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I am a registered GSSoC 2026 contributor
          required: false
        - label: I would like to work on this issue
          required: false
