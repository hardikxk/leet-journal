server:
  port: 8001
spring:
  application:
    name: problems-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8000
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: user
    password: pass
  sql:
    init:
      mode: always
logging:
  pattern:
    console: "[%X{requestId}] %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"